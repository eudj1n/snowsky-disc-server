name: Firmware-free checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # Reviewed reference CI pin
        with:
          persist-credentials: false
      - name: Verify runner tools
        run: |
          python3 -c 'import sys; assert sys.version_info >= (3, 11)'
          node --version
          cc --version
      - name: Build native host service and run synthetic conformance
        run: bash scripts/test.sh
      - name: Shell and Python syntax
        run: |
          for script in $(git ls-files '*.sh'); do bash -n "$script"; done
          python3 -m compileall -q scripts tests
  mips:
    # The gateway from the pinned toolchain, as a release builds it (soft-float, FPU-free, the
    # build id of its sources' last commit), packaged with the boot layer's package.py at the
    # revision this repository pins (scripts/boot-revision).
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # Reviewed reference CI pin
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: The boot layer's pinned revision
        run: echo "BOOT_REVISION=$(cat scripts/boot-revision)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # Reviewed reference CI pin
        with:
          repository: eudj1n/snowsky-disc-boot
          ref: ${{ env.BOOT_REVISION }}
          path: .boot
          persist-credentials: false
      - name: The pinned cross toolchain
        run: docker build --platform linux/amd64 -t disc-native-toolchain -f device/Dockerfile.toolchain .
      - name: The MIPS build
        run: bash scripts/build.sh mips
      - name: The release files as a release would hold them (not a release)
        run: DISC_BOOT_DIR="$GITHUB_WORKSPACE/.boot" python3 scripts/release.py build --not-a-release --version "$(cat firmware/active-version).0-ci.${GITHUB_SHA::7}" --output dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mips-${{ github.sha }}
          path: dist/
          retention-days: 14

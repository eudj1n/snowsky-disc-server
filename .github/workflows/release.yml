name: Release draft
# A tag v<firmware>.<number> (v2.57.1) builds the release package again from the pinned
# toolchain and the boot layer's pinned packaging, requires it to be the recorded,
# guest-accepted one (releases/<version>.json) and leaves a draft release; the owner publishes
# it. Debug packages and the signed .update file are never made here.
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  draft:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # Reviewed reference CI pin
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: The boot layer's pinned revision
        run: echo "BOOT_REVISION=$(cat scripts/boot-revision)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # Reviewed reference CI pin
        with:
          repository: eudj1n/snowsky-disc-boot
          ref: ${{ env.BOOT_REVISION }}
          path: .boot
          persist-credentials: false
      - name: The synthetic conformance
        run: bash scripts/test.sh
      - name: The pinned cross toolchain
        run: docker build --platform linux/amd64 -t disc-native-toolchain -f device/Dockerfile.toolchain .
      - name: The MIPS build
        run: bash scripts/build.sh mips
      - name: The release package, checked against its record
        run: |
          version="${GITHUB_REF_NAME#v}"
          export DISC_BOOT_DIR="$GITHUB_WORKSPACE/.boot"
          python3 scripts/release.py build --version "$version" --output dist
          python3 scripts/release.py check --version "$version" --dist dist --notes notes.md
      - name: The draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md
